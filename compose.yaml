# EREZER admin panel: full stack.
#   Production:   docker compose -f compose.yaml up -d --build
#   Local stack:  docker compose up -d --build        (also loads compose.override.yaml: exposes DB/MinIO ports)
#   Infra only:   docker compose up -d postgres minio minio-init   (then run backend/frontend natively)
name: erezer-invoice

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erezer}
      POSTGRES_USER: ${POSTGRES_USER:-erezer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing images in late 2025; see README "Object storage" before deploying elsewhere.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-erezer}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    restart: "no"

  backend:
    build: ./erezerbackend
    image: erezer-invoice/backend:${APP_VERSION:-local}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erezer}
      DB_USERNAME: ${POSTGRES_USER:-erezer}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COURIER_ENCRYPTION_KEY: ${COURIER_ENCRYPTION_KEY:?set COURIER_ENCRYPTION_KEY in .env}
      COURIER_ALLOW_INSECURE_HOSTS: ${COURIER_ALLOW_INSECURE_HOSTS:-localhost,127.0.0.1}
      COMPANY_NAME: ${COMPANY_NAME:-EREZER}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_INVOICE_FOOTER: ${COMPANY_INVOICE_FOOTER:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9010}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-erezer}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}

  frontend:
    build: ./erezerfrontend
    image: erezer-invoice/frontend:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8088}:80"

volumes:
  postgres-data:
  minio-data:
