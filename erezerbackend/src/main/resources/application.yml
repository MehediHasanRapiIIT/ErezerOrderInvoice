spring:
  application:
    name: erezer-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/erezer}
    username: ${DB_USERNAME:erezer}
    password: ${DB_PASSWORD:erezer}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,storage
  health:
    readiness-state:
      enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

app:
  time-zone: Asia/Dhaka
  company:
    name: ${COMPANY_NAME:EREZER}
    address: ${COMPANY_ADDRESS:Opposite of Dhaka Commerce College, Mirpur-2, Dhaka}
    phone: ${COMPANY_PHONE:01708697257}
    email: ${COMPANY_EMAIL:contact@erezer.com}
    invoice-footer: ${COMPANY_INVOICE_FOOTER:Thank you for shopping with EREZER!}
  security:
    jwt:
      # Base64-encoded HMAC key of at least 256 bits. Generate with: openssl rand -base64 48
      secret: ${JWT_SECRET:}
      issuer: erezer-admin
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      # Each refresh starts a new window, so this is the idle timeout: 30 minutes without using the panel signs out.
      refresh-token-ttl: ${JWT_REFRESH_TTL:30m}
    refresh-cookie:
      name: erezer_rt
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
    login:
      max-failed-attempts: 5
      lockout-duration: 15m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  courier:
    # Base64 AES-256 key that encrypts courier API credentials at rest. Generate: openssl rand -base64 32
    encryption-key: ${COURIER_ENCRYPTION_KEY:}
    # Hosts that may be called over plain http (local testing only). Everything else must be https.
    allow-insecure-hosts: ${COURIER_ALLOW_INSECURE_HOSTS:localhost,127.0.0.1}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9010}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${app.storage.endpoint}}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:erezer}
    initialize-bucket: ${STORAGE_INITIALIZE_BUCKET:true}
    presigned-url-ttl: 15m
