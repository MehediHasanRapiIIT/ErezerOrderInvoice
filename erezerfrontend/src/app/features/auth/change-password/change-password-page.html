<div class="mx-auto max-w-lg">
  <h1 class="page-title">Change password</h1>
  <p class="page-subtitle">Changing your password signs you out on every other device.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card mt-6 space-y-5 p-6" novalidate>
    @if (error(); as message) {
      <div class="rounded-md border border-red-800 bg-red-950/60 px-3 py-2 text-sm text-red-200" role="alert">{{ message }}</div>
    }

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-300">Current password</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" class="field" />
    </label>

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-300">New password</span>
      <input
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        class="field"
        [class.field-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
      />
      <span class="mt-1 block text-xs text-slate-400">10–72 characters, with at least one letter and one digit.</span>
    </label>

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-300">Confirm new password</span>
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        class="field"
        [class.field-invalid]="form.hasError('mismatch') && form.controls.confirmPassword.touched"
      />
      @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
        <span class="mt-1 block text-xs text-red-300">Passwords do not match</span>
      }
    </label>

    <div class="flex justify-end">
      <button type="submit" class="btn-primary" [disabled]="submitting()">
        @if (submitting()) {
          <i class="fas fa-circle-notch fa-spin"></i>
        }
        Update password
      </button>
    </div>
  </form>
</div>
