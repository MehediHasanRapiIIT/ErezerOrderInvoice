<div class="flex min-h-screen items-center justify-center bg-app px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <h1 class="mb-1">
        <span class="block bg-white" role="img" aria-label="Erezer Admin" style="height:24px;aspect-ratio:865/96;-webkit-mask:url(logo-wordmark.png) left center/contain no-repeat;mask:url(logo-wordmark.png) left center/contain no-repeat"></span>
      </h1>
      <p class="mb-4 text-sm italic tracking-wide text-slate-400">Erase the Ordinary</p>
      <p class="mt-1 text-sm text-slate-400">Sign in to manage orders</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5 rounded-xl border border-line bg-panel p-6 shadow-xl" novalidate>
      @if (signedOutIdle && !error()) {
        <div class="flex items-start gap-2 rounded-md border border-amber-800 bg-amber-950/50 px-3 py-2 text-sm text-amber-200" role="status">
          <i class="fas fa-clock mt-0.5"></i>
          <span>You were signed out after 30 minutes without activity. Sign in again to continue.</span>
        </div>
      }
      @if (error(); as message) {
        <div class="flex items-start gap-2 rounded-md border border-red-800 bg-red-950/60 px-3 py-2 text-sm text-red-200" role="alert">
          <i class="fas fa-exclamation-circle mt-0.5"></i>
          <span>{{ message }}</span>
        </div>
      }

      <label class="block">
        <span class="mb-1.5 block text-sm font-medium text-slate-300">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          class="field"
          [class.field-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="mt-1 block text-xs text-red-300">Enter a valid email address</span>
        }
      </label>

      <label class="block">
        <span class="mb-1.5 flex items-center justify-between text-sm font-medium text-slate-300">
          Password
          <a routerLink="/forgot-password" class="text-xs font-normal text-brand-light hover:underline">Forgot password?</a>
        </span>
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="field pr-10"
            [class.field-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-200 cursor-pointer"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="mt-1 block text-xs text-red-300">Password is required</span>
        }
      </label>

      <button type="submit" class="btn-primary w-full" [disabled]="submitting()">
        @if (submitting()) {
          <i class="fas fa-circle-notch fa-spin"></i> Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
