# Serves the Angular build and reverse-proxies /api to the Spring Boot backend (same origin, so no CORS).
# In production it sits behind Caddy (TLS), so the client address and scheme come from Caddy's headers.

# Trust X-Forwarded-For only from private Docker networks (Caddy), so $remote_addr is the real visitor.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# "https" when Caddy terminated TLS; plain $scheme when nginx is reached directly (local stack).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 60m;
        # nginx adds these for every response; drop Spring Security's copies to avoid duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Product images: presigned MinIO links (bucket "erezer", path-style) on this same address, so production
    # needs no separate media hostname. The signature covers the Host header, so it is passed through unchanged.
    # ^~ so the .png/.jpg rule below cannot take image links away from MinIO.
    location ^~ /erezer/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=600";
    }

    # Actuator stays internal (Docker health checks hit the backend directly).
    location /actuator/ {
        return 404;
    }

    # Content-hashed bundles and fonts never change: cache for a year.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unhashed images from /public (logo, favicon) may be replaced: cache briefly.
    location ~* \.(?:svg|png|jpe?g|gif|ico|webp)$ {
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html must never be cached, or users keep running an old build.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
